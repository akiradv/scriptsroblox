<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Página não encontrada</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230a0a0a'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%2310b981' font-family='monospace' font-weight='bold'>A</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        
        .error-content {
            max-width: 500px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .error-message {
            font-size: 16px;
            color: var(--text-dim);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .error-btn-primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        
        .error-btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .error-btn-secondary {
            background: transparent;
            color: var(--text-dim);
        }
        
        .error-btn-secondary:hover {
            color: var(--text);
            border-color: var(--border-hover);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Página não encontrada</h1>
            <p class="error-message">
                O script que você procura não existe ou foi movido. Volte para a biblioteca principal e explore os scripts disponíveis.
            </p>
            <div class="error-actions">
                <a href="index.html" class="error-btn error-btn-primary">Voltar ao início</a>
                <a href="https://github.com/akiradv" target="_blank" class="error-btn error-btn-secondary">Ver no GitHub</a>
            </div>
        </div>
    </div>
</body>
</html>
